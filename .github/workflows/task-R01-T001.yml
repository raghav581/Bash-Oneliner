# Generated by task_curation/build_task_workflows.py from task_checks/R01-T001.sh. Do not edit by hand.
name: "R01-T001 · Correct the 'Show group of user' entry"

on:
  pull_request:
    branches:
      - work/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-R01-T001-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: R01-T001 check
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'work/R01-T001'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check task requirements
        shell: bash
        run: |
          # R01-T001: Correct the 'Show group of user' entry (README.md).
          fail=0
          error() { echo "::error file=README.md::$1"; fail=1; }

          entry=$(awk '/^##### Show group of user$/{on=1; next} on && /^##### /{exit} on' README.md)
          if [ -z "$entry" ]; then
            error "The '##### Show group of user' entry is missing from README.md."
          else
            echo "--- 'Show group of user' entry ---"
            echo "$entry"
            echo "----------------------------------"
            if grep -qE '^\s*group username' <<<"$entry"; then error "The entry still uses 'group username', which is not a real command."; fi
            grep -qE '^\s*groups username' <<<"$entry" || error "The entry should use 'groups username'."
            grep -qE '^\s*id -Gn username' <<<"$entry" || error "The entry should show 'id -Gn username' as the alternative."
            grep -qE '^\s*(groups|id -Gn) username.*#' <<<"$entry" || error "Add a real output comment next to the command, e.g. '# alice : alice sudo docker'."
          fi

          grep -qx '##### Show uid, gid, group of user' README.md || error "The neighbouring entry 'Show uid, gid, group of user' must stay unchanged."

          for u in "$(id -un)" root; do
            a=$(groups "$u" | sed 's/^.*: *//')
            b=$(id -Gn "$u")
            echo "$u: groups=[$a] id -Gn=[$b]"
            [ "$a" = "$b" ] || error "groups and id -Gn disagree for $u."
          done

          exit $fail
      - name: Summary
        if: always()
        run: |
          {
            echo "### R01-T001: ${{ job.status }}"
            echo ""
            echo "Task issue: https://github.com/S-AI-Projects/Bash-Oneliner/issues/1"
            echo ""
            echo "Branch: \`work/R01-T001\`"
          } >> "$GITHUB_STEP_SUMMARY"
